spring:
  application:
    name: ledger
  datasource:
    # In-memory H2 in PostgreSQL mode by default, so the API runs with zero setup.
    # Point SPRING_DATASOURCE_URL at PostgreSQL for real use (see docker-compose.yml).
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

ledger:
  # How often expired holds are released and webhook deliveries are attempted.
  hold-sweep-interval: 1s
  webhook-poll-interval: 250ms
  webhook-max-attempts: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi
